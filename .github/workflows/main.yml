name: Build Ankush AI Video Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      paths:
  - "AnkushAIStudio_V6_PREMIUM_FUNCTIONAL_FIXED.zip"
      - ".github/workflows/main.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q AnkushAIStudio_V6_PREMIUM_FUNCTIONAL_FIXED.zip -d project

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnkushAIStudio-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
