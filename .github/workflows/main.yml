name: Build Ankush AI Video Studio V17

on:
  workflow_dispatch:
  push:
    paths:
      - "AnkushAIStudio_V17_REAL_HUMAN_PERFORMANCE_UPDATE_READY.zip"
      - ".github/workflows/main.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          set -e
          test -f AnkushAIStudio_V17_REAL_HUMAN_PERFORMANCE_UPDATE_READY.zip
          rm -rf project
          mkdir -p project
          unzip -q AnkushAIStudio_V17_REAL_HUMAN_PERFORMANCE_UPDATE_READY.zip -d project

      - name: Decrypt permanent signing keystore
        env:
          V17_SIGNING_PASSWORD: ${{ secrets.V17_SIGNING_PASSWORD }}
        working-directory: project
        run: |
          set -e
          if [ -z "$V17_SIGNING_PASSWORD" ]; then
            echo "::error::GitHub secret V17_SIGNING_PASSWORD is missing."
            exit 1
          fi
          test -f signing/ankush-release.p12.enc
          mkdir -p signing
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in signing/ankush-release.p12.enc \
            -out signing/ankush-release.p12 \
            -pass env:V17_SIGNING_PASSWORD
          keytool -list \
            -keystore signing/ankush-release.p12 \
            -storetype PKCS12 \
            -storepass "$V17_SIGNING_PASSWORD" >/dev/null

      - name: Build signed Release APK
        working-directory: project
        env:
          V17_SIGNING_PASSWORD: ${{ secrets.V17_SIGNING_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AnkushAIStudio-V17-signed-release-apk
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
